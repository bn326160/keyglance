name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            target: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            target: x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Keyglance ${{ github.ref_name }}"
          releaseBody: |
            See the assets below to download and install Keyglance.

            ## macOS — "App is damaged" warning

            Because the app is not signed with an Apple Developer certificate, macOS Gatekeeper may show a warning that the app is "damaged" or "can't be opened". To fix this, run the following command after installing:

            ```bash
            xattr -cr /Applications/keyglance.app
            ```

            Then open the app again. You will also need to grant **Accessibility** permission on first launch.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
